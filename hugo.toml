baseURL = 'https://hugo.8888-8888.me/'
languageCode = 'zh-Hans'
title = '你也不是我的救赎'
defaultContentLanguage = 'zh'

[languages]
  [languages.zh]
    languageName = '简体中文'
    contentDir = 'content'
    weight = 1

# 模块导入：使用 Blowfish 主题
[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v2"
  [[module.imports]]
    path = "github.com/hugomods/encrypt"
  [[module.imports]]
    path = "github.com/hugomods/pwa"

enableRobotsTXT = true
enableGitInfo = true
hasCJKLanguage = true
buildDrafts = false
buildFuture = true
buildExpired = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10

[params]
  colorScheme = "neon"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true

  # Firebase 配置
  [params.firebase]
    apiKey = "AIzaSyB8iXuLPpZhyR2el6-nu_fT5USCshK6CzY"
    authDomain = "hugo1-7c608.firebaseapp.com"
    projectId = "hugo1-7c608"
    storageBucket = "hugo1-7c608.firebasestorage.app"
    messagingSenderId = "98635676046"
    appId = "1:98635676046:web:c1f5a82cb25f24eb5d4cdf"

  # Blowfish 首页布局配置
  [params.homepage]
    layout = "background"
    homepageImage = "https://api.dujin.org/bing/1920.php" 
    showRecent = true
    showRecentItems = 6
    showMoreLink = true
    showMoreLinkDest = "/posts"
    cardView = true
    cardViewScreenWidth = false
    layoutBackgroundBlur = true

  # 作者信息
  [params.author]
    name = "cai6"
    image = "img/personal/avatar.png"
    headline = "蔡的小破站 - 记录技术学习与生活感悟，分享编程智慧"
    description = "记录技术学习与生活感悟，分享编程智慧"
    links = [
      { icon = "github", href = "https://github.com/pengcai6" }
    ]

  [params.header]
    layout = "fixed"

  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  [params.article]
    showDate = true
    showViews = true
    showLikes = true
    showAuthor = true
    showHero = true
    heroStyle = "background"
    layoutBackgroundBlur = true
    layoutBackgroundHeaderSpace = true
    showBreadcrumbs = false
    showDraftLabel = true
    showHeadingAnchors = true
    showPagination = true
    showReadingTime = true
    showTableOfContents = true
    showRelatedContent = true
    relatedContentLimit = 3
    showWordCount = true

  [params.list]
    showHero = true
    heroStyle = "background"
    layoutBackgroundBlur = true
    layoutBackgroundHeaderSpace = true
    showBreadcrumbs = false
    showSummary = false
    showCards = true
    cardView = true

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 10

  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 20

  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 30

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40

  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50


hasCJKLanguage = true
summaryLength = 140

[markup]
  [markup.highlight]
    noClasses = false
    style = "dracula"

[minify]
  disableXML = true
  minifyOutput = true
