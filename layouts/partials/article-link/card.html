{{ $page := .Page }}
<article class="article-row">
  <div class="article-row__meta">
    <time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02" }}</time>
    {{ with .Params.categories }}<span>{{ index . 0 }}</span>{{ end }}
    {{ if and .Draft .Site.Params.article.showDraftLabel }}<span>草稿</span>{{ end }}
  </div>
  <h3 class="article-row__title">
    <a
      {{ with $page.Params.externalUrl }}
        href="{{ . }}" target="_blank" rel="external"
      {{ else }}
        href="{{ $page.RelPermalink }}"
      {{ end }}
      class="article-row__link">
      {{ .Title | emojify }}
      {{ if .Params.externalUrl }}<span class="article-row__external" aria-label="外部链接">↗</span>{{ end }}
    </a>
  </h3>
  <span class="article-row__arrow" aria-hidden="true">→</span>
</article>
